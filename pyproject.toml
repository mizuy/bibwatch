[project]
name = "bibwatch"
version = "0.1.0"
description = "Research theme watcher: poll literature feeds, enrich, translate abstracts, publish RSS"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "feedparser>=6",
  "httpx>=0.27",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpx>=0.30"]

[project.scripts]
bibwatch = "bibwatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bibwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
